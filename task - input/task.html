<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My feedback form</h1>
    <form action="">
        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="user_name" /> <br>
            <label for="name">Email:</label>
            <input type="text" id="name" name="user_mail" /> <br>
            <label for="name">Password:</label>
            <input type="password" id="name" name="user_password" /> <br>
            
        <p>Please check all the emotions that apply to you:</p>
        <label for="Angry">Angry</label>
        <input type="checkbox" id="Angry" name="Angry" value="Angry"> <br>
        <label for="Sad">Sad</label>
        <input type="checkbox" id="Sad" name="Sad" value="Sad"><br>
        <label for="Happy">Happy</label>
        <input type="checkbox" id="Happy" name="Happy" value="Happy"><br>
        <label for="Ambivalent">Ambivalent</label>
        <input type="checkbox" id="Ambivalent" name="Ambivalent" value="Ambivalent"><br>

        <p>How to satisfied were you with our service?</p>
        <input type="radio" id="very" name="service" value="Very">
        <label for="very">Very satisfied</label><br>
        <input type="radio" id="satisfied" name="service" value="Satisfied">
        <label for="satisfied">Satisfied</label><br>
        <input type="radio" id="care" name="service" value="Care">
        <label for="care">Dindn't care</label><br>
        <input type="radio" id="diss" name="service" value="Dissatisfied">
        <label for="diss">Dissatisfied</label><br>
        <input type="radio" id="verydiss" name="service" value="Very dissatisfied">
        <label for="verydiss">Very dissatisfied</label><br>
        <label for="comments">Further comments:</label>
        <textarea name="comments" id="comments"></textarea><br>
        <label for="photo">Big photo:</label>
        <input type="text" id="photo" name="photo" />
        <input type="file"> <br>
        <label for="location">Location visted:</label>
        <input type="number" name="location" id="location"><br>
        <button>Submit</button>
  
  

        </p>










    </form>
</body>
</html>
