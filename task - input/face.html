<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
</head>
<body>
    <form action="">
        <h1>Create a new account</h1>
        <p>It's quick and easy</p>
        <label for="fname"></label><br>
        <input type="text" id="fname" name="fname" placeholder="First name" required>
        <label for="sname"></label>
        <input type="text" id="sname" name="sname" placeholder="Surname" required><br>
        <label for="birth">Date of Birth:</label><br>
        <label for="day"></label>
        <select id="day" title="Day"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected="1">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select>
        <label for="month"></label>
        <select id="month" title="Month"><option value="1">Jan</option><option value="2">Feb</option><option value="3" selected="1">Mar</option><option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select>
        <label for="date"></label>
        <input type="datetime-local" name="Date" id="date"><br><br>
        <label for="mail"></label>
        <input type="text" name="mail" id="mail" placeholder="Mail or number" required>
        <label for="pass"></label><br><br>
        <input type="password" name="password" id="pass" placeholder="New password" required><br><br>
        <button style="color: rgb(255, 255, 255); background-color: rgb(24, 165, 24);">Signup</button>




    </form>
</body>
</html>
